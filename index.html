/* SLOT MACHINE */
const SLOT_SYMBOLS=["🍒","🍋","🍇","🔔","💎","👑"];
let slotsBusy=false,slotsBest=0;
function updateSlotsControls(){
 const input=document.getElementById("slotsBet"),btn=document.getElementById("slotsSpin");if(!input)return;
 const bet=Math.max(10,Math.floor(Number(input.value)||10));input.value=bet;
 document.getElementById("slotsBetStat").textContent=bet.toLocaleString("ru-RU")+" 🪙";
 btn.disabled=slotsBusy||bet>state.balance;btn.textContent=slotsBusy?"🎰 КРУТЯТСЯ...":"🎰 КРУТИТЬ ЗА "+bet.toLocaleString("ru-RU")+" 🪙";
}
function setSlotsBet(v){if(slotsBusy)return;document.getElementById("slotsBet").value=v==="max"?Math.max(10,Math.floor(state.balance)):v;updateSlotsControls()}
function changeSlotsBet(d){if(slotsBusy)return;const x=document.getElementById("slotsBet"),v=Math.max(10,Math.floor(Number(x.value)||10));x.value=Math.max(10,v+(d>0?10:-10));updateSlotsControls()}
function slotPayout(a){const counts={};a.forEach(x=>counts[x]=(counts[x]||0)+1);if(a.every(x=>x===a[0]))return a[0]==="👑"?15:a[0]==="💎"?8:a[0]==="🍋"?5:a[0]==="🍒"?3:2;return Object.values(counts).includes(2)?1.2:0}
/* Slot machine sound effects (generated with Web Audio) */
let slotAudioContext=null;
function playSlotSound(kind="tick",reelIndex=0){
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  if(!slotAudioContext)slotAudioContext=new Ctx();
  const ctx=slotAudioContext;if(ctx.state==="suspended")ctx.resume();
  const now=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();
  const sounds={
   tick:{freq:520+reelIndex*95,end:260+reelIndex*55,duration:.045,volume:.025,type:"square"},
   stop:{freq:240+reelIndex*100,end:115+reelIndex*45,duration:.13,volume:.055,type:"triangle"},
   win:{freq:660,end:1320,duration:.52,volume:.045,type:"sine"},
   jackpot:{freq:880,end:1760,duration:.8,volume:.06,type:"sine"}
  };
  const p=sounds[kind]||sounds.tick;osc.type=p.type;
  osc.frequency.setValueAtTime(p.freq,now);
  osc.frequency.exponentialRampToValueAtTime(p.end,now+p.duration);
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(p.volume,now+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,now+p.duration);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+p.duration+.02);
 }catch(e){}
}
function spinOneSlotReel(reel,finalSymbol,delay){
 return new Promise(resolve=>{
  reel.classList.add("spinning");
  let elapsed=0,step=0,wait=42;
  function tick(){
   if(step%2===0)playSlotSound("tick",Math.min(2,Math.floor(delay/520)));
   if(step<18)reel.textContent=SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)];
   else if(step<25)reel.textContent=SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)];
   else {reel.textContent=finalSymbol;playSlotSound("stop",Math.min(2,Math.floor(delay/520)));reel.classList.remove("spinning");reel.classList.add("stopping");setTimeout(()=>reel.classList.remove("stopping"),260);resolve();return}
   step++;wait=step<15?48:step<21?72:step<25?115:wait;
   setTimeout(tick,wait);
  }
  setTimeout(tick,delay);
 });
}
async function spinSlots(){
 if(slotsBusy)return;const bet=Math.floor(Number(document.getElementById("slotsBet").value));
 if(!Number.isFinite(bet)||bet<10||bet>state.balance){alert("Недостаточно монет или неверная ставка.");return}
 slotsBusy=true;state.balance-=bet;addTurnover(bet);state.stats.slotsGames=(state.stats.slotsGames||0)+1;save();updateSlotsControls();
 const reels=[0,1,2].map(i=>document.getElementById("slotReel"+i));
 const result=Array.from({length:3},()=>SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]);
 await Promise.all(reels.map((reel,i)=>spinOneSlotReel(reel,result[i],i*520)));
 const mult=slotPayout(result),reward=Math.floor(bet*mult);
 if(reward){state.balance+=reward;registerWin(reward);state.stats.slotsWins=(state.stats.slotsWins||0)+1;slotsBest=Math.max(slotsBest,mult);playSlotSound(mult>=8?"jackpot":"win") }
 document.getElementById("slotsWinStat").textContent=reward?"+"+reward.toLocaleString("ru-RU")+" 🪙":"0 🪙";
 document.getElementById("slotsBestStat").textContent="x"+slotsBest;
 document.getElementById("slotsMessage").textContent=reward?"🎉 "+result.join(" ")+" — ВЫИГРЫШ x"+mult+"!":"😢 "+result.join(" ")+" — в следующий раз повезёт!";
 save();slotsBusy=false;updateSlotsControls()
}

function casinoNote(freq,when,duration,volume,type){

function poolShot(){
 const b=gameBet("poolBet");if(!b){alert("Нужна ставка от 100");return}
 state.balance-=b;
 const angle=+document.getElementById("poolAngle").value*Math.PI/180,power=+document.getElementById("poolPower").value;
 const v=.012+Math.max(0,Math.min(100,power))*.00034;
 poolBodies=[
  {x:.28,y:.5,vx:Math.cos(angle)*v,vy:-Math.sin(angle)*v,color:"#f5f0df",active:true},
  {x:.64,y:.43,vx:0,vy:0,color:"#e8c743",active:true},
  {x:.69,y:.5,vx:0,vy:0,color:"#2c62ae",active:true},
  {x:.64,y:.57,vx:0,vy:0,color:"#c83f38",active:true},
  {x:.73,y:.46,vx:0,vy:0,color:"#f1f0e9",active:true},
  {x:.73,y:.55,vx:0,vy:0,color:"#d58b35",active:true}
 ];
 let frame=0,potted=0;
 const step=()=>{
  const R=.022;
  for(let i=0;i<poolBodies.length;i++){const a=poolBodies[i];if(!a.active)continue;
   a.x+=a.vx;a.y+=a.vy;
   if(a.x<R||a.x>1-R){a.x=Math.max(R,Math.min(1-R,a.x));a.vx*=-.82}

 };

}

function tttBestMove(board,player){
 const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 const order=[4,0,2,6,8,1,3,5,7];
 const winner=a=>{for(const [x,y,z] of lines)if(a[x]&&a[x]===a[y]&&a[y]===a[z])return a[x];return a.every(Boolean)?"draw":""};
 const solve=(a,p,depth)=>{
  const w=winner(a);
  if(w==="O")return {score:100-depth};
  if(w==="X")return {score:depth-100};
  if(w==="draw")return {score:0};
  let best={score:p==="O"?-Infinity:Infinity,index:-1};
  for(const i of order)if(!a[i]){
   a[i]=p;const score=solve(a,p==="O"?"X":"O",depth+1).score;a[i]="";
   if((p==="O"&&score>best.score)||(p==="X"&&score<best.score))best={score,index:i};
  }
  return best;
 };
 return solve(board.slice(),player,0).index;
}

function pokerCompare(a,b){for(let i=0;i<Math.max(a.length,b.length);i++)if((a[i]||0)!==(b[i]||0))return(a[i]||0)>(b[i]||0)?1:-1;return 0;}
function pokerLabel(v){return ["","Старшая карта","Пара","Две пары","Тройка","Стрит","Флеш","Фулл-хаус","Каре","Стрит-флеш","Рояль-флеш"][v[0]];}
function pokerRender(){let g=pokerGame;if(!g)return;document.getElementById("pokerPot").textContent="БАНК: "+g.pot+" 🪙";document.getElementById("pokerStreet").textContent=["ПРЕФЛОП","ФЛОП","ТЁРН","РИВЕР","ШОУДАУН"][g.street];document.getElementById("pokerCommunity").innerHTML=Array.from({length:5},(_,i)=>g.board[i]?pokerCard(g.board[i]):'<span class="poker-card back">?</span>').join("");document.getElementById("pokerHand").innerHTML=g.players[0].hand.map(pokerCard).join("");document.getElementById("pokerHandName").textContent=g.board.length>=3?pokerLabel(pokerEvaluate([...g.players[0].hand,...g.board])):"Карманные карты";document.getElementById("pokerSeats").innerHTML=g.players.map((p,i)=>'<div class="poker-seat '+(p.folded?"folded":"")+'"><strong>'+(i?"🤖 "+p.name:"ТЫ")+(p.folded?" · ФОЛД":"")+'</strong><span>Фишки: '+p.stack+' · Ставка: '+p.put+'</span>'+(g.done&&i?'<div>'+p.hand.map(c=>c.r+c.u).join(" ")+'</div>':"")+'</div>').join("");document.getElementById("pokerMessage").textContent=g.message;let owed=Math.max(0,g.currentBet-g.players[0].put),ok=g.active&&!g.players[0].folded;["pokerCheck","pokerCall","pokerRaise","pokerFold","pokerAllin"].forEach(id=>document.getElementById(id).disabled=!ok);document.getElementById("pokerCheck").disabled=!ok||owed>0;document.getElementById("pokerCall").disabled=!ok||!owed;document.getElementById("pokerCall").textContent="КОЛЛ "+owed;document.getElementById("pokerStart").disabled=g.active;}
function pokerPut(p,n){n=Math.max(0,Math.min(p.stack,n));p.stack-=n;p.put+=n;pokerGame.pot+=n;}
function pokerStart(){if(pokerGame?.active)return;if(state.balance<20){document.getElementById("pokerMessage").textContent="Нужно минимум 20 монет.";return;}let d=pokerDeck(),names=["Ты","SKEBOB BOT","Lucky Bot","Poker Face"],ps=names.map((name,i)=>({name,stack:i?1000:state.balance,hand:[d.pop(),d.pop()],put:0,folded:false,allin:false}));pokerGame={deck:d,players:ps,board:[],pot:0,currentBet:20,street:0,active:true,done:false,message:"Блайнды 10/20. Твой ход.",acted:new Set()};pokerPut(ps[0],10);pokerPut(ps[1],20);state.balance=ps[0].stack;save();pokerRender();}
function pokerAdjustBet(n){let e=document.getElementById("pokerBet");e.value=Math.max(20,(Number(e.value)||40)+n);}
function pokerAct(a){let g=pokerGame;if(!g?.active)return;let p=g.players[0],owed=Math.max(0,g.currentBet-p.put);if(a==="fold"){p.folded=true;g.message="Ты сбросил карты.";}else if(a==="check"){if(owed)return;g.message="Ты чекнул.";}else if(a==="call"){pokerPut(p,owed);g.message="Ты уравнял ставку.";}else if(a==="raise"){let n=Math.max(g.currentBet+20,Number(document.getElementById("pokerBet").value)||40);pokerPut(p,n-p.put);g.currentBet=p.put;g.message="Ты повысил ставку.";}else if(a==="allin"){pokerPut(p,p.stack);p.allin=true;g.currentBet=Math.max(g.currentBet,p.put);g.message="ОЛЛ-ИН!";}pokerBots();}
function pokerBots(){let g=pokerGame;if(!g||g.done)return;for(let i=1;i<4;i++){let p=g.players[i];if(p.folded||p.allin)continue;let owed=Math.max(0,g.currentBet-p.put),strength=g.board.length>=3?pokerEvaluate([...p.hand,...g.board])[0]:(p.hand[0].r===p.hand[1].r?2:1);if(owed>p.stack||(owed>0&&strength===1&&Math.random()<.42)){p.folded=true;continue;}if(owed)pokerPut(p,owed);else if(strength>=3&&Math.random()<.2){pokerPut(p,20);g.currentBet=Math.max(g.currentBet,p.put);}}let alive=g.players.filter(p=>!p.folded);if(alive.length===1){pokerFinish(alive[0],"Все соперники сбросили карты — банк твой!");return;}if(alive.filter(p=>!p.allin).length<=1||g.street===3){pokerRunout();pokerFinish(null,"Шоудаун!");return;}pokerNext();}
function pokerNext(){let g=pokerGame;g.players.forEach(p=>p.put=0);g.currentBet=0;g.street++;if(g.street===1)g.board.push(g.deck.pop(),g.deck.pop(),g.deck.pop());else g.board.push(g.deck.pop());g.message=["","Флоп открыт. Твой ход.","Тёрн! Твой ход.","Ривер! Последний раунд торгов."][g.street];if(g.players[0].folded||g.players[0].allin){pokerBots();return;}pokerRender();}
function pokerRunout(){let g=pokerGame;while(g.board.length<5)g.board.push(g.deck.pop());}
function pokerFinish(winner,msg){let g=pokerGame;g.active=false;g.done=true;if(!winner){let live=g.players.filter(p=>!p.folded),best=null,w=[];live.forEach(p=>{let v=pokerEvaluate([...p.hand,...g.board]),c=best?pokerCompare(v,best):1;if(c>0){best=v;w=[p];}else if(c===0)w.push(p);});let share=Math.floor(g.pot/w.length);w.forEach(p=>{p.stack+=share;if(p===g.players[0])state.balance+=share;});msg+=" Победитель: "+w.map(p=>p.name).join(", ")+". "+pokerLabel(best);}else{winner.stack+=g.pot;if(winner===g.players[0])state.balance+=g.pot;}save();g.message=msg+" Банк: "+g.pot+" 🪙";pokerRender();}
